<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trailer Docs">
<meta name="theme-color" content="#1b4965">
<title>Trailer Docs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --surface-2:#eeece5;
  --ink:#1e2a30; --muted:#5d6b72; --line:#ded9cf;
  --accent:#1b4965; --accent-soft:#e2ebf0; --link:#1b6a8e; --tap:#2a6f8e;
  --warn:#9a6608; --warn-bg:#fbf0d4; --warn-line:#e6c877;
  --note:#2a6f8e; --note-bg:#e7eff4; --note-line:#bcd4e0;
  --done:#3f7a52; --done-bg:#e6f0e7;
  --shadow:0 1px 2px rgba(20,30,35,.06),0 4px 14px rgba(20,30,35,.05);
  --oncolor:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171b; --surface:#1a2228; --surface-2:#222d34;
  --ink:#e7ecee; --muted:#9aa7ae; --line:#2c383f;
  --accent:#7bb0cc; --accent-soft:#1d2e39; --link:#8fc3dd; --tap:#8fc3dd;
  --warn:#e6b752; --warn-bg:#2a2314; --warn-line:#5a4a1e;
  --note:#8fc3dd; --note-bg:#152530; --note-line:#2c414d;
  --done:#79c091; --done-bg:#16241a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --oncolor:#06131b;
}}
:root[data-theme="dark"]{
  --bg:#11171b; --surface:#1a2228; --surface-2:#222d34;
  --ink:#e7ecee; --muted:#9aa7ae; --line:#2c383f;
  --accent:#7bb0cc; --accent-soft:#1d2e39; --link:#8fc3dd; --tap:#8fc3dd;
  --warn:#e6b752; --warn-bg:#2a2314; --warn-line:#5a4a1e;
  --note:#8fc3dd; --note-bg:#152530; --note-line:#2c414d;
  --done:#79c091; --done-bg:#16241a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  --oncolor:#06131b;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.55;
  -webkit-text-size-adjust:100%;}
a{color:var(--link);}
.wrap{max-width:720px;margin:0 auto;padding:0 16px;}

/* ---------- top bars ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--accent);color:#fff;box-shadow:var(--shadow);}
:root[data-theme="dark"] .bar,:root:not([data-theme="light"]) .bar{color:var(--oncolor);}
.bar-row{display:flex;align-items:center;gap:12px;padding:11px 16px;max-width:720px;margin:0 auto;}
.bar h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:20px;
  letter-spacing:.3px;margin:0;text-transform:uppercase;line-height:1.05;}
.bar .build{margin-left:auto;text-align:right;line-height:1.2;white-space:nowrap;}
.bar .build .v{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;}
.bar .build .d{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.78;}
.backbtn{appearance:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);
  color:inherit;font:inherit;font-size:19px;line-height:1;width:38px;height:38px;border-radius:10px;
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.backbtn:active{transform:scale(.95);}
.bar .mtitle{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:18px;
  text-transform:uppercase;letter-spacing:.3px;line-height:1;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.reset{appearance:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);
  color:inherit;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;
  min-height:34px;white-space:nowrap;}
.count{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;white-space:nowrap;opacity:.95;}
.progress{height:3px;background:rgba(255,255,255,.22);}
.progress>i{display:block;height:100%;width:0%;background:#fff;transition:width .25s ease;}
:root[data-theme="dark"] .progress>i,:root:not([data-theme="light"]) .progress>i{background:var(--oncolor);}

/* segmented view tabs */
.tabs{display:flex;gap:0;background:var(--surface-2);border-bottom:1px solid var(--line);
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:15;}
.tabs-in{display:flex;gap:6px;max-width:720px;margin:0 auto;width:100%;padding:8px 16px;}
.tab{flex:1;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);
  font:inherit;font-size:14px;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer;
  text-align:center;min-height:38px;}
.tab.active{background:var(--accent);color:var(--oncolor);border-color:var(--accent);}

/* ---------- hub ---------- */
.hero{padding:26px 0 8px;}
.hero .kicker{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);}
.hero h2{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:30px;
  margin:2px 0 4px;color:var(--accent);letter-spacing:.3px;}
.hero p{margin:0;color:var(--muted);font-size:15px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
  padding:18px 0 40px;}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:13px;padding:15px 15px 16px;box-shadow:var(--shadow);color:var(--ink);
  min-height:112px;cursor:pointer;}
.tile:active{transform:scale(.985);}
.tile.soon{border-left-color:var(--line);opacity:.72;cursor:default;}
.tile .tt{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:18px;
  color:var(--accent);letter-spacing:.2px;}
.tile.soon .tt{color:var(--ink);}
.tile .ts{font-size:13px;color:var(--muted);flex:1;}
.pill{align-self:flex-start;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);}
.tile.soon .pill{background:var(--surface-2);color:var(--muted);}

/* ---------- reading (Guide / Illustrated) ---------- */
.reading{counter-reset:sec;padding-bottom:70px;}
.reading>*:first-child{margin-top:2px;}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);margin:16px 0 6px;overflow:hidden;}
.toc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 16px;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:1px;font-size:14px;color:var(--accent);}
.toc>summary::-webkit-details-marker{display:none;}
.toc>summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted);}
.toc[open]>summary .chev{transform:rotate(180deg);}
.toc ol{margin:0;padding:2px 0 10px;list-style:none;counter-reset:t;}
.toc li{counter-increment:t;}
.toc a{display:flex;gap:11px;padding:8px 16px;text-decoration:none;color:var(--ink);
  font-size:15.5px;border-top:1px solid var(--line);}
.toc li:first-child a{border-top:none;}
.toc a::before{content:counter(t);font-family:"IBM Plex Mono",monospace;font-weight:600;
  color:var(--accent);min-width:20px;text-align:right;}
.doc h1{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:25px;letter-spacing:.2px;
  color:var(--accent);margin:34px 0 4px;padding-bottom:7px;border-bottom:2px solid var(--accent);
  text-wrap:balance;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px);}
.doc h1::before{counter-increment:sec;content:counter(sec) "  ";color:var(--muted);
  font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;}
.doc h2{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:19px;color:var(--accent);
  margin:22px 0 2px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px);}
.doc p{margin:11px 0;}
.doc ol,.doc ul{margin:11px 0;padding-left:0;}
.doc ol{counter-reset:li;list-style:none;}
.doc ol>li{counter-increment:li;position:relative;padding-left:40px;margin:9px 0;}
.doc ol>li::before{content:counter(li);position:absolute;left:0;top:1px;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:14px;color:var(--oncolor);
  background:var(--accent);width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.doc ul{list-style:none;}
.doc ul>li{position:relative;padding-left:24px;margin:7px 0;}
.doc ul>li::before{content:"";position:absolute;left:6px;top:.68em;width:7px;height:7px;border-radius:2px;background:var(--accent);}
.doc li>p{margin:0;}
.doc figure{margin:18px 0;}
.doc img.photo{display:block;margin:0 auto;max-width:100%;width:auto;height:auto;
  /* portraits off a phone are 3:4 -- uncapped they'd fill the screen on their own */
  max-height:72vh;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);}
.doc figcaption{margin:7px 2px 0;color:var(--muted);font-size:14.5px;line-height:1.4;text-align:center;}
.doc .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.doc .pair figure{margin:0;}
.doc .pair img.photo{max-height:46vh;}
.doc .pair figcaption{font-size:13.5px;}
.reading:not(.show-img) .doc figure,
.reading:not(.show-img) .doc .pair,
.reading:not(.show-img) .doc img.photo{display:none;}
.callout{border-radius:10px;padding:12px 15px 12px 14px;margin:15px 0;border-left:4px solid var(--warn-line);
  background:var(--warn-bg);box-shadow:var(--shadow);}
.callout.note{border-left-color:var(--note-line);background:var(--note-bg);}
.callout .clabel{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;font-size:13px;color:var(--warn);margin-bottom:2px;}
.callout.note .clabel{color:var(--note);}
.callout p{margin:0;}
.photobanner{background:var(--note-bg);border:1px dashed var(--note-line);border-radius:10px;
  padding:11px 14px;margin:14px 0;color:var(--note);font-size:14.5px;}
.totop{display:block;text-align:center;margin:24px auto 0;font-size:14px;color:var(--muted);text-decoration:none;}

/* ---------- checklist ---------- */
.checklist{padding:6px 0 70px;}
details.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:12px;
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 120px);}
details.phase>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 15px;}
details.phase>summary::-webkit-details-marker{display:none;}
.badge{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--oncolor);
  background:var(--accent);min-width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.phase-title{font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:18px;letter-spacing:.2px;flex:1;}
.chev{color:var(--muted);transition:transform .2s;flex:none;}
details.phase[open] .chev{transform:rotate(180deg);}
.steps{padding:2px 8px 10px;display:flex;flex-direction:column;gap:2px;}
button.step{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:transparent;
  border:none;border-radius:9px;padding:11px 9px;font:inherit;color:var(--ink);cursor:pointer;line-height:1.4;}
button.step:active{background:var(--surface-2);}
.cbox{flex:none;width:23px;height:23px;margin-top:1px;border:2px solid var(--tap);border-radius:6px;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.cbox svg{width:15px;height:15px;stroke:var(--oncolor);opacity:0;}
button.step.done .cbox{background:var(--done);border-color:var(--done);}
button.step.done .cbox svg{opacity:1;}
.step-txt{flex:1;}
button.step.done .step-txt{color:var(--muted);text-decoration:line-through;
  text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);}
.step b{font-weight:600;color:var(--accent);}
button.step.done .step b{color:inherit;}
button.step.imp{background:var(--warn-bg);border-left:3px solid var(--warn-line);border-radius:7px;}
button.step.imp .cbox{border-color:var(--warn);}
button.step.imp .step-txt{font-weight:500;}
button.step.imp .flag{color:var(--warn);font-weight:700;}
button.step.win{background:var(--done-bg);border-left:3px solid var(--done);border-radius:7px;}
button.step.win .step-txt{font-weight:600;}
.ref-head{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:1.5px;
  font-size:13px;font-weight:700;color:var(--muted);margin:30px 4px 4px;}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:11px;padding:13px 15px;margin-top:11px;box-shadow:var(--shadow);}
.card.amber{border-left-color:var(--warn-line);background:var(--warn-bg);}
.card h3{font-family:"Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.6px;
  font-size:14px;font-weight:700;color:var(--accent);margin:0 0 8px;}
.card.amber h3{color:var(--warn);}
.card p{margin:5px 0;font-size:15px;}
.card .k{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);font-size:13.5px;}
.card.amber .k{color:var(--warn);}
.card .muted{color:var(--muted);}
.card .row{display:flex;gap:8px;margin:5px 0;}
.card .row .lab{font-weight:600;min-width:62px;flex:none;color:var(--ink);}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin:28px 0 10px;}

@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>

<script>window.MANUALS = [{"id": "setup", "title": "Trailer Setup", "subtitle": "On-site setup procedure", "status": "ready", "guide": "<h1 id=\"unloading-the-trailer\">Unloading the Trailer<\/h1>\n<p>The trailer will usually arrive in one of two ways: either on a flatbed-style recovery truck / transport lorry, or towed behind a van.<\/p>\n<p>In both cases you will need to switch on the hydraulics. To do this, open the shutter door at the back by the hitch point. On the left side, to the right of the AC unit, you should find a red turn-switch — twist it so it is vertical to enable the hydraulics.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1115\" height=\"1280\" src=\"photos/setup-hydrolics_off.0625eb2a.webp\" alt=\"Red turn-switch, vertical = hydraulics on\" />\n<figcaption aria-hidden=\"true\">Red turn-switch, vertical = hydraulics on<\/figcaption>\n<\/figure>\n<p>Once the hydraulics are on, the trailer should appear in the HPC hydraulic app so you can control it. If it does not appear after a few minutes, the car battery powering it may be dead. You should find a jump kit in the back section.<\/p>\n<h2 id=\"using-the-jump-pack\">Using the jump pack<\/h2>\n<p>Connect the jump pack in this order:<\/p>\n<ol type=\"1\">\n<li><strong>Red to Dead (+):<\/strong> attach the red positive clamp to the positive (+) terminal on the dead battery.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><strong>Black to Ground (–):<\/strong> attach the black negative clamp to a solid, unpainted metal part away from the battery.<\/li>\n<\/ol>\n<p>When finished, detach in reverse order.<\/p>\n<p>If the jump pack is also dead, you will need a jump from a car or van. You should find jump cables in the back.<\/p>\n<h2 id=\"using-jump-cables-from-another-vehicle\">Using jump cables from another vehicle<\/h2>\n<p>When attaching jump cables, do it in this order:<\/p>\n<ol type=\"1\">\n<li><strong>Red to Dead (+):<\/strong> connect the first red clamp to the positive (+) terminal of the dead battery.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p><strong>Red to Live (+):<\/strong> connect the other red clamp to the positive (+) terminal of the live battery.<\/p><\/li>\n<li><p><strong>Black to Live (–):<\/strong> connect the first black clamp to the negative (–) terminal of the live battery.<\/p><\/li>\n<li><p><strong>Black to Dead Ground (–):<\/strong> connect the final black clamp to an unpainted metal part away from the dead battery.<\/p><\/li>\n<\/ol>\n<p>When finished, detach in reverse order.<\/p>\n<p>If the trailer arrives on the recovery truck, its legs will have been extended to support it during the journey, so once the driver says it is safe, retract the legs fully. It is also worth checking that the driver has unlocked the handbrake lever by the hitch point, as many forget this.<\/p>\n<h1 id=\"choosing-a-position\">Choosing a Position<\/h1>\n<p>Production will have chosen a rough spot for the trailer to be set up, but you are in charge of picking the exact position. Use the following criteria:<\/p>\n<ul>\n<li>Extra space on the sides so it can expand during setup — at least 2 metres.<\/li>\n<\/ul>\n<!-- -->\n<ul>\n<li><p>The ground is not too uneven. The hydraulic legs stabilise very well on unstable ground, but there is a limit to how much they can do.<\/p><\/li>\n<li><p>There is space for the stairs — at least 1.2 metres.<\/p><\/li>\n<li><p>The ground at the bottom of the stairs is not much higher than the ground under the trailer, otherwise the trailer door cannot be opened.<\/p><\/li>\n<\/ul>\n<p>If the trailer is being towed and is in position, you may need to help the driver’s vehicle detach from the hitch. Once the hitch is no longer locked, you can use the legs to raise the trailer, lift the hitch off the driver’s tow bar, and they can then drive forward.<\/p>\n<p>Once the trailer is in position and detached, you can stabilise the legs. There is a button for this in the app, and you can also use manual mode with the app’s spirit level if you need more control.<\/p>\n<p>Lower the hitch wheel by rotating the lever until it starts to take some of the weight, then make sure the handbrake by the hitch is on. As much as possible, we want the weight held by the legs rather than the tyres.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>Please check that the stairs can be lowered properly and the trailer door can be opened before the driver leaves. If you can’t get in, the driver will have to help reposition the trailer.<\/p>\n<\/div>\n<h1 id=\"asking-for-power\">Asking for Power<\/h1>\n<p>Once the trailer is in position, the next thing to do is check whether power is available. You won’t need it for the next part of the setup, but it can take a while for production to sort out power, so the sooner it’s arranged the better.<\/p>\n<p>The trailer has three input ports for power, and it needs all three:<\/p>\n<ul>\n<li><p><strong>1 × 32 amp 3-phase<\/strong> (large cable with a red port)<\/p><\/li>\n<li><p><strong>2 × 16 amp single-phase<\/strong> (smaller cables with a blue port)<\/p><\/li>\n<\/ul>\n<p>Mostly you will get power from a nearby generator, but sometimes it’s studio power. Unfortunately we have unusual power requirements and will usually need a distribution box (distro) to convert the generator’s output to the correct outputs for the trailer.<\/p>\n<p>Luckily, we have our own distro box that can take an input of 1 × 63 amp 3-phase (larger cable with a red port) and output the correct power for the trailer.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"960\" height=\"1280\" src=\"photos/setup-distro.1f4c7c09.webp\" alt=\"Our own distro\" />\n<figcaption aria-hidden=\"true\">Our own distro<\/figcaption>\n<\/figure>\n<p>You will get used to asking for: “1 × 32 amp 3-phase and 2 × 16 amp single-phase, or just 1 × 63 amp 3-phase.”<\/p>\n<p>Most generators will have a 63 amp 3-phase output, so inspect for that. If there are already distro boxes on the generator, check whether there are enough of the correct outputs for us.<\/p>\n<p>If there is not the correct power — or usually no power at all — message your production contact and let them know, as a lack of power will grind the setup to a halt.<\/p>\n<p>If you do get confused by the power, try to get in contact with the sparks on set and they will figure it out pretty quickly.<\/p>\n<h1 id=\"opening-the-sides\">Opening the Sides<\/h1>\n<p>On the side of the trailer there are three connections to undo before it can be lifted. On either end is a spring-assisted locking bolt — pull the bolt down and twist it so it is caught and can’t snap back.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"962\" height=\"1280\" src=\"photos/setup-spring_bolt_under_side.1b68be75.webp\" alt=\"bolt closed\" />\n<figcaption aria-hidden=\"true\">bolt closed<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"944\" height=\"964\" src=\"photos/setup-spring_bolt_under_side_open.1ace01ea.webp\" alt=\"bolt open\" />\n<figcaption aria-hidden=\"true\">bolt open<\/figcaption>\n<\/figure>\n<p>In the centre is a red cable with two small carabiners. One carabiner will be around a hole in the frame of the trailer’s chassis; unclip it and attach it to where the other carabiner is. This also creates a useful handle for packdown.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1036\" height=\"1280\" src=\"photos/setup-red_handle.0bb27d42.webp\" alt=\"red cable\" />\n<figcaption aria-hidden=\"true\">red cable<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1153\" height=\"1280\" src=\"photos/setup-red_carabiner_attach_point.96ece61e.webp\" alt=\"un clip\" />\n<figcaption aria-hidden=\"true\">un clip<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"658\" height=\"1280\" src=\"photos/setup-red_cable_as_handle.e4ccc3d6.webp\" alt=\"re clip\" />\n<figcaption aria-hidden=\"true\">re clip<\/figcaption>\n<\/figure>\n<p>Once the side has all three connections undone, you should be able to grab the bottom and lift it up. You won’t be able to lift it fully, but enough for it to be held by its own tension.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"960\" src=\"photos/setup-roof_up_side.60735cea.webp\" alt=\"roof open\" />\n<figcaption aria-hidden=\"true\">roof open<\/figcaption>\n<\/figure>\n<p>This should reveal two white panels on the trailer’s side. They are only held in by a weak magnet at the centre, so they should pull away from the middle easily, pivoting on the edges. As these panels come out they will hit the side you lifted earlier and push it up. Slowly alternate between each panel as you pull them out, and they will lift the side to its full height as it becomes the ceiling of the expanded section.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"920\" height=\"1280\" src=\"photos/setup-opening_side_panel.ad92dfa9.webp\" alt=\"pulling out expanding sides\" />\n<figcaption aria-hidden=\"true\">pulling out expanding sides<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"981\" height=\"1280\" src=\"photos/setup-side_panel_open.d1a7c21d.webp\" alt=\"fully open\" />\n<figcaption aria-hidden=\"true\">fully open<\/figcaption>\n<\/figure>\n<p>Now there will be a single large white panel left on the side of the trailer. Each side has a single connection point — another spring-assisted locking bolt.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"864\" src=\"photos/setup-white_panel_bolt_open.57c3a463.webp\" alt=\"un-bolt\" />\n<figcaption aria-hidden=\"true\">un-bolt<\/figcaption>\n<\/figure>\n<p>Unbolt each side. The panel should have some movement in it, so you may need to give it a shove so the bolt can come free. In rare cases the bolt may be jammed because there is too much pressure on it; if this happens, raise the legs on this side of the trailer and/or lower the legs on the opposite side so the weight of the trailer leans away from the panel.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>Repeat these steps in exactly the same way on the opposite side of the trailer. This is vital, because you don’t want to accidentally try to lower a side that is still connected.<\/p>\n<\/div>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"960\" src=\"photos/setup-sides_wall_open.6374ee5f.webp\" alt=\"ready for hydaulics\" />\n<figcaption aria-hidden=\"true\">ready for hydaulics<\/figcaption>\n<\/figure>\n<h1 id=\"lowering-the-hydraulic-sides\">Lowering the Hydraulic Sides<\/h1>\n<p>Once both hydraulic side panels have been exposed and unbolted, it’s time to lower them. Make sure the hydraulics are on (red switch twisted vertical).<\/p>\n<p>In the app, go to the Extras page. There will be Extra 1 and Extra 2 — one for each side. A trailer diagram will confirm which side you are controlling; the dot in the diagram is the hitch point, so use that to orient yourself.<\/p>\n<p>To lower the sides, press and hold EXTEND and the side should start lowering. However, around seven times out of ten the hydraulics battery will fail, the app will lose connection, and the side won’t move. If this happens at any stage of lowering the sides, you will have to finish with the manual override system.<\/p>\n<h2 id=\"manual-override\">Manual override<\/h2>\n<p>In the rear of the trailer, behind the shutter door on the right, you will find the hydraulic override.<\/p>\n<p>There are two silver metal rods with twisty tops; these control what operation the manual crank will perform. The rod in front controls the right side, and the rod at the back controls the left side. Each rod has three states: raise, neutral, and lower.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"889\" height=\"1280\" src=\"photos/setup-manual_override_pilons.3bf96723.webp\" alt=\"right = front, left = back\" />\n<figcaption aria-hidden=\"true\">right = front, left = back<\/figcaption>\n<\/figure>\n<p>On the back of the rod you will see a small pin and some channels cut into the rod for the pin to slide through. It looks and behaves similarly to a manual transmission in a car, but instead of 5–6 gears there are three. Each position puts the hydraulics into one of the three states:<\/p>\n<ul>\n<li><p><strong>Top:<\/strong> raise<\/p><\/li>\n<li><p><strong>Middle:<\/strong> neutral<\/p><\/li>\n<li><p><strong>Bottom:<\/strong> lower<\/p><\/li>\n<\/ul>\n<p>To move the pin, twist the top of the rod to move it laterally, and pull or push to move it vertically.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"877\" height=\"1280\" src=\"photos/setup-manual_overide.23ebf400.webp\" alt=\"up,neutrual,down\" />\n<figcaption aria-hidden=\"true\">up,neutrual,down<\/figcaption>\n<\/figure>\n<p>To continue, put one pin into the bottom position and make sure the other is in neutral. Then retrieve the crank bar from its place on the inside of the cabinet door next to you. To the right of the control rods you will see a hole that the crank bar slots into.<\/p>\n<ol type=\"1\">\n<li>Crank the bar from left to right. It should feel relatively easy; if it is resisting hard, stop and double-check the pins, as you may be trying to raise the side.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>After about ten cranks, go and visually check that the desired side is lowering. It takes around five minutes of cranking to fully lower a side.<\/p><\/li>\n<li><p>The side being lowered has two metal pins at its corners, designed to slot into openings on the expanded sides. If there are two of you, one person should stay by the side and may have to pull the expanded sides closer into the lowering side so the pins line up.<\/p><\/li>\n<\/ol>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"790\" height=\"1280\" src=\"photos/setup-side_lowering.84bc3811.webp\" alt=\"pin and hole\" />\n<figcaption aria-hidden=\"true\">pin and hole<\/figcaption>\n<\/figure>\n<ol start=\"3\" type=\"1\">\n<li>Keep cranking until you feel resistance, then check the pins. They often catch on the lip of the opening; if they do, give the expanded side a shove and the pin should fall into the hole.<\/li>\n<\/ol>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"803\" height=\"793\" src=\"photos/setup-side_pin_alignment.b9d5f96d.webp\" alt=\"pin caught\" />\n<figcaption aria-hidden=\"true\">pin caught<\/figcaption>\n<\/figure>\n<ol start=\"4\" type=\"1\">\n<li>Make sure both pins on the side are slotted into the expanded-wall holes, and give a final crank check to make sure it’s fully down. Don’t try to push past resistance.<\/li>\n<\/ol>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"1229\" src=\"photos/setup-side_lowered.0f00ffb2.webp\" alt=\"side lowered\" />\n<figcaption aria-hidden=\"true\">side lowered<\/figcaption>\n<\/figure>\n<h2 id=\"fitting-the-support-legs\">Fitting the support legs<\/h2>\n<p>Head inside to grab the four metal legs. Go to a corner of the trailer and place one underneath so that it touches both the expanded side and the lowered floor panel, then twist it so it wedges itself between the ground and the corner.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"906\" height=\"1280\" src=\"photos/setup-support_leg.0197e30d.webp\" alt=\"leg\" />\n<figcaption aria-hidden=\"true\">leg<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1051\" height=\"1280\" src=\"photos/setup-support_leg_attached.4edf2c12.webp\" alt=\"leg in postion\" />\n<figcaption aria-hidden=\"true\">leg in postion<\/figcaption>\n<\/figure>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>A trick with these metal legs: get them to almost the right height before placing them underneath. To change the height quickly, hold the leg in one hand to stop the nut from spinning, and with your free hand swivel the foot around to change its height.<\/p>\n<\/div>\n<p>Repeat this on the other three corners.<\/p>\n<h2 id=\"raising-the-final-side\">Raising the final side<\/h2>\n<p>Now it’s time to raise the final side. Head inside the trailer and stand in the middle, on the edge of the rig. Bend down and lift the side up — it is fairly heavy, so you may need help.<\/p>\n<p>Once it’s raised there are four connection points to lock it in place. On either side, at the top corner, there is a spring-assisted locking bolt and a metal locking hinge.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"1138\" src=\"photos/setup-wall_bolts.5b376f39.webp\" alt=\"bolt and hinge\" />\n<figcaption aria-hidden=\"true\">bolt and hinge<\/figcaption>\n<\/figure>\n<p>Release the bolt so it slides behind the metal. For the hinge, push the slider on the front up to unlock it, position it so the loop is caught by the ceiling, then pull it down so it locks. Make sure all four connections are attached, then repeat on the other side.<\/p>\n<h1 id=\"powering-the-trailer\">Powering the Trailer<\/h1>\n<p>By this point you may have noticed it’s very dark in the trailer — the next thing you need is power. If there is still no sign of power, chase up your production coordinator and explain that you are now unable to continue until power arrives.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>All the cable types are different, so don’t worry about connecting something wrong — only the correct ports will connect.<\/p>\n<\/div>\n<h2 id=\"amp-3-phase-large-cable-with-a-red-port\">1 × 32 amp 3-phase (large cable with a red port)<\/h2>\n<p>This input cable is found in the rear of the trailer behind the shutter door, resting on top of the battery. Take the end and try to feed it through the small hole at the back right corner of the space it’s in. It won’t fully fit, so go around and try pulling from the other side; give it a few twists and it should reluctantly pop through.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"1205\" src=\"photos/setup-32_amp_port.33434b3a.webp\" alt=\"almost out\" />\n<figcaption aria-hidden=\"true\">almost out<\/figcaption>\n<\/figure>\n<p>Run the cable to the power source (distro box or generator). If you don’t have enough cable, there is a large extension inside the back of the trailer, in the section above the battery and hydraulics.<\/p>\n<h2 id=\"amp-single-phase-smaller-cables-with-a-blue-port\">2 × 16 amp single-phase (smaller cables with a blue port)<\/h2>\n<p>These cables are coiled inside the main area of the trailer, with their ports hanging outside the bottom. You will need to feed the cable through the hole — it’s easier with two people, one inside and one outside, but it’s perfectly doable by yourself.<\/p>\n<p>Once enough cable has been fed through to the outside, connect them to a power source (distro or generator). If the cables don’t reach, extensions can be found in the rear of the trailer, in the section above the battery and hydraulics.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>If you are using a distribution box (some setups may have more than one in the system), check that the breaker switches for the ports you need are flipped up so that red is showing. Red means on (danger); green means off (safe).<\/p>\n<\/div>\n<h2 id=\"switching-on-at-the-breaker-box\">Switching on at the breaker box<\/h2>\n<p>Head back inside the trailer and go to the back to find the main breaker box. Flip the large breaker at the top to enable the 32 amp power to the trailer, then — if they aren’t up already — flip breaker 2 (charges the hydraulics battery) and breaker 4 (labelled LIGHTS).<\/p>\n<p>Now the ceiling lights should be on and you can start expanding the rig.<\/p>\n<h1 id=\"expanding-the-rig\">Expanding the Rig<\/h1>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>First, inspect the rig for any damage. If there is any, please let David or Theo know and we can advise.<\/p>\n<\/div>\n<p>The rig will have been secured with ratchet straps and metal cables. There are four ratchet straps, one in each corner of the rig — undo them all and store them neatly in a corner.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1013\" height=\"1280\" src=\"photos/setup-corner_ratchet_flocked.288aada7.webp\" alt=\"corner ratchet straps\" />\n<figcaption aria-hidden=\"true\">corner ratchet straps<\/figcaption>\n<\/figure>\n<p>Next, find the metal cables that attach the rig to the ceiling bar. Unscrew the green pins to remove them, and try to keep the pins attached to the cable ends when storing.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"966\" src=\"photos/setup-green_pin.3eb9aec8.webp\" alt=\"try not to drop the pin\" />\n<figcaption aria-hidden=\"true\">try not to drop the pin<\/figcaption>\n<\/figure>\n<p>There will be a cable with a carabiner wrapped around the door frame on the right side near the trailer entrance — remove that as well.<\/p>\n<p>There will be two more metal cables attached to the central frame near the rear of the trailer. These won’t be accessible until you have unfolded one half.<\/p>\n<h2 id=\"clearing-the-clutter\">Clearing the clutter<\/h2>\n<p>Now is the best time to clear the clutter. Take all the foam used for packing and put it in a corner of the trailer.<\/p>\n<p>Take the long grey dehumidifiers from the sides of the rig and place them on the handles at the top of the trailer’s inside walls.<\/p>\n<p>Take everything stored near the main PC and put it safely in the trailer’s corners, or at least out of the way of where the rig will need to expand into.<\/p>\n<p>Make a final check that nothing is on the floor where the rig will end up — this includes the 16 amp single-phase cables that run outside.<\/p>\n<h2 id=\"unfurling-the-rig\">Unfurling the rig<\/h2>\n<p>Now it’s time to start unfurling. If you stand in the door facing the rig, you will start with the side to your left — the side the 16 amp cables exit through.<\/p>\n<ol type=\"1\">\n<li>Walk along that side of the rig and release the brakes on all the frames by flicking the black plastic tab by the wheels so it’s horizontal.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>There should not be any cables dragging on the ground. If there are, carefully try to re-attach them to the frame.<\/p><\/li>\n<li><p>Carefully begin pulling the frames apart. It’s best to go slowly — move around and pull different frames so they all move at a similar rate. You will meet resistance; if you do, check whether a wire has fallen under a wheel. If not, it’s likely a wheel is up against one of the long bumps on the floor. The easiest way to move over the bumps is to change sides and push the frame with a foot, applying pressure to the metal bar with the wheels.<\/p><\/li>\n<li><p>Get the frames into a rough semi-circle shape, then look at the floor. You will find two metal circles — these are spring-loaded holes. There are two metal locking bolts on the bottom of the frames, which should be near the holes; find them, then pull and wiggle the frame until the bolt is over the hole and slide it in to fix the frame in position.<\/p><\/li>\n<\/ol>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"953\" height=\"1280\" src=\"photos/setup-left_side_unfurled.50907241.webp\" alt=\"left side open\" />\n<figcaption aria-hidden=\"true\">left side open<\/figcaption>\n<\/figure>\n<ol start=\"4\" type=\"1\">\n<li><p>Now that the left side is open, you have access to the last cables tying the middle frame to the ceiling bar. Unscrew the green pins and store the cables.<\/p><\/li>\n<li><p>Begin unfurling the other side in a similar, careful fashion. On this side there are three bolts, not two. The door frame should end up near the trailer door and line up with the other side of the frame (there will be a gap between the two sides).<\/p><\/li>\n<li><p>Find the marker board and place it in the middle of the rig — there should be black and red tape markers for where it’s positioned.<\/p><\/li>\n<\/ol>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1070\" height=\"1280\" src=\"photos/setup-full_rig_oppen.aac55b59.webp\" alt=\"fully open\" />\n<figcaption aria-hidden=\"true\">fully open<\/figcaption>\n<\/figure>\n<ol start=\"7\" type=\"1\">\n<li><p>Stand in the middle of the marker board and look at each frame in turn; they should all face you. If they don’t, adjust them. Once you’re done you should have a cohesive circle where every frame points forward, to the centre.<\/p><\/li>\n<li><p>Go around and turn on the frame brakes by flipping the black plastic tab by the wheel so it points up.<\/p><\/li>\n<\/ol>\n<h1 id=\"powering-the-rig\">Powering the Rig<\/h1>\n<p>Now the rig is expanded, it’s time to turn all the cameras on. Find one of the bigger plastic tubs that was stored next to the main PC and transit; inside you will find 2 × 16 amp cables with multi-plugs on the end.<\/p>\n<p>Take the white multi-plug and attach it to the 16 amp cable that powers the left (the side with the hole for the 16 amp cables), and place it by the left side.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"902\" height=\"1280\" src=\"photos/setup-multi-plug.3da03a75.webp\" alt=\"white multi-plug\" />\n<figcaption aria-hidden=\"true\">white multi-plug<\/figcaption>\n<\/figure>\n<p>There are four plugs coming from the rig that need to be plugged into the white multi-plug. These plugs are the power source for the vertical multi-plugs on the frames; during transit they are wrapped around the lights.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1043\" height=\"1280\" src=\"photos/setup-plug_around_light.592e5448.webp\" alt=\"plugs in transit\" />\n<figcaption aria-hidden=\"true\">plugs in transit<\/figcaption>\n<\/figure>\n<p>Once all four are plugged in, take the black multi-plug (with three usable ports) to the other side, find the three plugs and plug them in.<\/p>\n<p>That will power two-thirds of the rig. The last third is powered by the 32 amp cable and is turned on from the main breaker box: flip breakers 5 and 6 (PC) and the last of the rig should come alive.<\/p>\n<h2 id=\"frame-2\">Frame 2<\/h2>\n<p>There is still a single frame left without power: Frame 2.<\/p>\n<p>Go back to the plastic tub and find an ESPA power box that has NO blue tape on it. The power box should come with a power brick, but no kettle lead to power it. Take it over to Frame 2 — you should find a kettle lead wrapped around one of the nearby lights to power the ESPA box. At the base of the frame, all the camera DC power ports should be either hanging or tidied near the base; plug them all into the ESPA box and Frame 2 should come alive.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1070\" height=\"1280\" src=\"photos/setup-frame_20_espa.49874233.webp\" alt=\"frame 2 ESPA\" />\n<figcaption aria-hidden=\"true\">frame 2 ESPA<\/figcaption>\n<\/figure>\n<h2 id=\"the-sonys\">The Sonys<\/h2>\n<p>Head back to the plastic tub and retrieve the last two ESPA boxes with their power bricks. Place one on the outside of the left frame near the back of the trailer, and the other on the outside of the right frame near the back of the trailer.<\/p>\n<p>The plastic tub should also contain several thick power cables with blue tape — these connect the Sonys to the ESPA boxes. Go to each Sony, find its power input port (it should have blue tape on it) and attach the cable. If the cable doesn’t reach the ESPA box, use a second cable as an extension. There are enough cables for all the Sonys to be powered without being under tension.<\/p>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1262\" height=\"1280\" src=\"photos/setup-sony_power.dd5220e9.webp\" alt=\"connecting to sony battery\" />\n<figcaption aria-hidden=\"true\">connecting to sony battery<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"1071\" src=\"photos/setup-sny_kettle_around_light.82348310.webp\" alt=\"sony kettle stored in transit\" />\n<figcaption aria-hidden=\"true\">sony kettle stored in transit<\/figcaption>\n<\/figure>\n<figure>\n<img class=\"photo\" loading=\"lazy\" decoding=\"async\" width=\"1280\" height=\"1115\" src=\"photos/setup-sony_espa_powered_on.8aa79575.webp\" alt=\"sony ESPA powered on\" />\n<figcaption aria-hidden=\"true\">sony ESPA powered on<\/figcaption>\n<\/figure>\n<h1 id=\"framing\">Framing<\/h1>\n<p>Now that everything is on, it’s time to frame. Leave the mini-PCs and the main PC off for this.<\/p>\n<p>First, find the long trigger cable that connects both sides of the trailer — it’s usually wrapped up on a light. Make sure it goes under the floor mat.<\/p>\n<h2 id=\"linking-the-led-lights\">Linking the LED lights<\/h2>\n<p>Standing in the trailer door facing in, look behind the pillar on your right to find the LED light hardware. Make sure its two plugs are connected.<\/p>\n<p>Then find the trigger cable with orange tape — this is what links the LED lights to the Sony trigger system. It plugs into a Sony start connector (blue tape) on frame 9; there should be a bit of orange tape on the connector’s port.<\/p>\n<p>Before plugging it in, thread the cable through one of the higher metal rings / eyelets so the cable is raised and not blocking the way.<\/p>\n<p>Now check that the Canons are triggering fine. You should be able to press the shutter, hear the mirror open, then press again to hear the shutter open and take the photo. If you don’t hear anything, or only one operation, there is a faulty connection.<\/p>\n<p>All the star connectors that split the fire signal to the Canons are attached at a similar height on the middle horizontal bar across all frames. Go around and inspect each connection on each star (you will have to go once on the inside and once on the outside to access all the stars). If it’s still not working, start isolating sections and debugging further.<\/p>\n<p>Once all Canons are operational, you can finally begin framing.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>This is the single longest task of the setup, so if anyone asks for an ETA, give yourself at least 3–4 hours from this point. Finishing early on a later ETA is better than finishing late on an optimistic one.<\/p>\n<\/div>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>Have someone stand in the centre as if they were being scanned. Only tell them to hold their hands in position when you frame the hand cameras — otherwise it’s like being held in a stress position at a CIA black site.<\/p>\n<\/div>\n<h2 id=\"what-to-frame-where\">What to frame where<\/h2>\n<p>There are different numbers of cameras on each frame, but there is a fairly simple rule set for what to frame where. Split the frame into two sections: top (above the middle bar) and bottom (below the middle bar). Ignore the Sonys for now.<\/p>\n<h2 id=\"top-section\">Top section<\/h2>\n<ul>\n<li><p>All zoom lenses are to be fully zoomed out to see the entire marker board and the person.<\/p><\/li>\n<li><p>All 50 mm lenses are to be framed on the head. If the subject is short, put their head in the bottom half of the frame to make sure taller subjects aren’t cut off, and vice versa.<\/p><\/li>\n<\/ul>\n<h2 id=\"bottom-section\">Bottom section<\/h2>\n<ul>\n<li><p>The zoom lens directly below the bar is fully zoomed in and aimed at the subject’s groin.<\/p><\/li>\n<li><p>The 50 mm next to the zoom lens points at the closest hand (left side points at the left hand, right side points at the right hand).<\/p><\/li>\n<li><p>The 50 mm below the hand camera points at the closest foot (make sure it’s framed so it sees both the marker board and the foot).<\/p><\/li>\n<li><p>The 50 mm next to the foot is another hand camera.<\/p><\/li>\n<li><p>If there is a zoom lens at the bottom, it is fully zoomed out to see the full marker board and the person.<\/p><\/li>\n<\/ul>\n<h2 id=\"polarising-filters\">Polarising filters<\/h2>\n<p>Most cameras will have a polarising filter, and it’s vital that they are cross-polarised with the lights. To check this, point the camera at a light that has a filter (the one most directly opposite) and rotate the polarising filter — the light should swap between grey and black every 180 degrees. Leave it as black as possible.<\/p>\n<p>Some cameras don’t have polarising filters. This is because they are SPEC cameras, designed to show how specular light interacts with the subject.<\/p>\n<h2 id=\"how-to-frame-a-canon-50-mm-camera\">How to frame a Canon 50 mm camera<\/h2>\n<p>Follow these steps:<\/p>\n<ol type=\"1\">\n<li>Turn the mode to Av.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>Flick the focus switch on the lens to its forward position to enable autofocus (note: there are a couple of cameras whose autofocus doesn’t work and will have to be focused manually).<\/p><\/li>\n<li><p>Press the Live View button.<\/p><\/li>\n<li><p>Unscrew the mounted camera head’s twist knob to allow it to move.<\/p><\/li>\n<li><p>Look at a polarised light and check it’s cross-polarised.<\/p><\/li>\n<li><p>Look at the subject and half-press the shutter to autofocus.<\/p><\/li>\n<li><p>Lock the camera head in this position.<\/p><\/li>\n<li><p>Press the Live View button to end live view.<\/p><\/li>\n<li><p>Flick the focus switch on the lens backwards to disable autofocus.<\/p><\/li>\n<li><p>Turn the mode back to Manual.<\/p><\/li>\n<\/ol>\n<h2 id=\"how-to-focus-a-canon-zoom-lens\">How to focus a Canon zoom lens<\/h2>\n<p>Follow the previous steps, except focus the camera both before and after polarising. Focusing the zoom lens can move the polarising filter, so we want to adjust the polarising filter once the focus is correct, then add a second focus afterwards to make sure you didn’t nudge the focus wheel.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>As you go round the cameras, if any won’t turn on or have issues, this is the best time to solve them — try re-inserting the battery, or chase the power wires to look for disconnections. If you are under time pressure from production, you can leave faulty cameras and focus on getting a working rig first.<\/p>\n<\/div>\n<h1 id=\"checking-your-framing\">Checking Your Framing<\/h1>\n<p>Now you’ve framed, it’s time to fully turn on the rig and check and refine.<\/p>\n<p>Go around to all the mini-PCs and manually turn them on.<\/p>\n<p>After the mini-PCs are on, look for the USB hubs that are either on the central bar or below it on the sides. Check that each one with a USB plugged in is turned on (some hubs are on when pushed in, some when pushed out); a blue light shows it’s on, although you have to look carefully as the light can bleed to other ports. You will need to check both the inside and outside of the frame to find all the hubs.<\/p>\n<h2 id=\"bringing-up-capture-grid\">Bringing up Capture Grid<\/h2>\n<p>Turn on the main PC, log in, and open Cyber Controller from the pinned icon on the taskbar. It should display all the mini-PCs as connected; if not, restart the missing ones.<\/p>\n<p>Open Capture Grid on the main PC, then press “Start all CG” to spawn Capture Grid nodes on the mini-PCs.<\/p>\n<p>After about 30 seconds, the main PC’s Capture Grid should display how many cameras are connected in the top right. Anything above 180 is very good; anything above 160 (with all PCs connected) is workable. Under 160 is reserved for catastrophic issues, like losing a power box.<\/p>\n<h2 id=\"checking-camera-settings\">Checking camera settings<\/h2>\n<p>Head to the Cameras section in Capture Grid to work through the settings. The first two (mode and focus) can’t be changed remotely — you have to go to the camera and fix it by hand — while the rest can be set directly in Capture Grid.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>The camera name helps you find its position — look for Fxx_Cxx in the name, which tells you which frame it is on and where the camera is. Cameras are numbered as if you were reading left to right from inside the rig, so _F08_C_03 is the 8th frame, third camera.<\/p>\n<\/div>\n<ol type=\"1\">\n<li>Sort by mode and find any cameras not on Manual. Use the Fxx_Cxx name to locate each one, then switch it to Manual by hand at the camera.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>Sort by focus and find any on AF. These also need switching to MF by hand at the camera.<\/p><\/li>\n<li><p>Sort by ISO — any Canons not on 200, change to 200 directly in Capture Grid (click on their ISO and select 200).<\/p><\/li>\n<li><p>Sort by aperture — any SPEC camera (with ‘SPEC’ in the name) should be F22, and non-SPEC should be F11.<\/p><\/li>\n<li><p>Sort by shutter speed — Canons should be 1/25 and Sonys 1/30.<\/p><\/li>\n<\/ol>\n<h2 id=\"clearing-live-view\">Clearing live view<\/h2>\n<p>Now find any cameras that still have live view on. Press Prime, then in Capture Grid sort by MLU (mirror lock-up). Working cameras will display “on + up”; if a camera says just “on”, it’s in live-view mode. Take a screenshot or phone picture of the faulty cameras, then press Fire to put all the mirrors back down. Head to each of those cameras and turn off live view.<\/p>\n<h2 id=\"checking-the-framing\">Checking the framing<\/h2>\n<p>Now it’s time to check the framing. Get someone in the middle, turn the main lights off with the breaker, and press Fire-Single.<\/p>\n<p>Once it’s finished downloading, check through each image, looking at focus, framing and polarisation. If any are bad, make a note of their Fxx_Cxx ID and why they are bad. Go back, find and fix those cameras, delete the images, and fire another single fire. Keep repeating this process — firing and checking images — until all the pictures are correct.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>If a couple are doing weird things but the settings seem correct, you can ignore them; it’s usually power issues or genuinely faulty cameras.<\/p>\n<\/div>\n<h2 id=\"framing-the-sonys\">Framing the Sonys<\/h2>\n<p>Finally, it’s time to frame the Sonys. To look at a Sony’s live view, press up twice on the front of it. It’s dark, but you should be able to see enough with the main light on to check the framing; if not, change the shutter speed to make it brighter.<\/p>\n<p>Usually only the _02_01, _02_02 and _02_03 cameras will need adjusting. They should all see the head; _02 and _03 are wider, so try to get some of the torso in as well.<\/p>\n<p>To focus the Sonys:<\/p>\n<ol type=\"1\">\n<li>Make sure someone is in the rig to be focused on. If they are small, tell them to hold a hand above their head and make themselves look bigger and taller, to give the Sonys a better chance.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>Go to the left panel in Capture Grid, make sure Multiple is selected, then pick a Sony from the dropdown list of cameras.<\/p><\/li>\n<li><p>Make sure the main lights are on.<\/p><\/li>\n<li><p>Change the focus mode from MF to AF Continuous, then press Prime + Single Fire.<\/p><\/li>\n<li><p>Wait for the images to download, then switch the cameras back to MF. Keep the subject standing in the centre until they are back on MF.<\/p><\/li>\n<li><p>On the main Cameras page, sort by group ‘Sony’ (this makes them easier to see) and check they are all in manual focus.<\/p><\/li>\n<li><p>Delete the images, then go for another Prime + Single Fire.<\/p><\/li>\n<li><p>Inspect the focus on all the Sony images. If any are bad, repeat the last steps, or go to the out-of-focus one and use the manual focus wheel.<\/p><\/li>\n<\/ol>\n<p>Now do a final full test fire of Prime + Fire and check the light pass is syncing.<\/p>\n<h1 id=\"final-check-lights\">Final Check — Lights<\/h1>\n<p>The last thing to do is check that all the lights are working. In Cyber Controller, press ‘Cycle’ and all the lights should fire in sequence. You should be able to hear any gaps in the flashes; if you’re unsure, cycle a few times and watch different sections to make sure every light is firing.<\/p>\n<h2 id=\"if-a-light-isnt-firing\">If a light isn’t firing<\/h2>\n<ol type=\"1\">\n<li>Check that it’s powered on. If it isn’t, find where the disconnect is.<\/li>\n<\/ol>\n<!-- -->\n<ol type=\"1\">\n<li><p>If it is on, press the [Test] button — it should flash. If it doesn’t, the bulb might be blown; tell Theo and David, and run without it for now.<\/p><\/li>\n<li><p>If the test fire works, find and replug the trigger cable at the back of the light, then cycle again.<\/p><\/li>\n<li><p>If it still doesn’t work, check the circuit board inside the PC cage for any loose connections.<\/p><\/li>\n<\/ol>\n<p>Once all the lights are cycling cleanly, move on to the final disk-space check below.<\/p>\n<h1 id=\"disk-space-check\">Disk Space Check<\/h1>\n<p>Once everything is working, the last check is disk space on the mini-PCs. On the main PC, go to Capture Grid and open the Network tab, then look for the disk space column — it shows how much space each mini-PC has left.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>If a mini-PC’s disk gets too full it starts delivering black images instead of erroring, so this is worth checking every time.<\/p>\n<\/div>\n<p>If any mini-PC is under 250 GB, right-click its disk-space number and click Clean.<\/p>\n<p>With the lights cycling cleanly and disk space clear, the trailer is set up and ready to scan.<\/p>\n", "toc": [["unloading-the-trailer", "Unloading the Trailer"], ["choosing-a-position", "Choosing a Position"], ["asking-for-power", "Asking for Power"], ["opening-the-sides", "Opening the Sides"], ["lowering-the-hydraulic-sides", "Lowering the Hydraulic Sides"], ["powering-the-trailer", "Powering the Trailer"], ["expanding-the-rig", "Expanding the Rig"], ["powering-the-rig", "Powering the Rig"], ["framing", "Framing"], ["checking-your-framing", "Checking Your Framing"], ["final-check-lights", "Final Check — Lights"], ["disk-space-check", "Disk Space Check"]], "hasPhotos": true, "checklist": {"phases": [{"title": "Unload & hydraulics", "steps": ["Open the shutter door at the back, by the hitch.", "Twist the red switch (right of the AC unit) to vertical to enable the hydraulics.", "Confirm the trailer appears in the <b>HPC app<\/b>.", "If it doesn't appear, jump-start the battery — see the <b>Jump-start<\/b> card.", "If on a recovery truck: once the driver says it's safe, retract the legs fully.", "If on a recovery truck: unlock the <b>handbrake lever<\/b> at the hitch."]}, {"title": "Position", "steps": ["Pick a spot with at least <b>2 m<\/b> clear on each side.", "Confirm at least <b>1.2 m<\/b> of space for the stairs.", "Check the ground is reasonably level.", "Check the ground at the stairs isn't higher than the trailer floor.", "If towed: raise the trailer on the legs and lift the hitch off the tow bar.", "Stabilise the legs — app button, or manual mode with the spirit level.", "Lower the hitch wheel until it takes some of the weight.", "Put the handbrake by the hitch on.", {"t": "Check the stairs lower fully — before the driver leaves.", "flag": "imp"}, {"t": "Check the trailer door opens — before the driver leaves.", "flag": "imp"}]}, {"title": "Ask for power", "steps": ["Confirm what's needed: <b>1×32A 3-phase<\/b> (red) and <b>2×16A single-phase<\/b> (blue).", "Ask production/sparks for the power — see the <b>Power<\/b> card for the phrasing.", "Check any distro boxes already on the generator for the correct outputs.", {"t": "If there's no power, or the wrong power, message your production contact.", "flag": "imp"}]}, {"title": "Open the sides — do each side", "steps": ["Undo the spring bolt at each end (pull down and twist so it catches).", "Unclip the centre red carabiner and re-clip it to the other point.", "Lift the side until it holds on its own tension.", "Pull the two white panels out from the centre, alternating between them.", "Unbolt the large white panel at each end.", {"t": "Repeat every step above on the opposite side.", "flag": "imp"}, {"t": "Confirm both sides are fully disconnected before lowering anything.", "flag": "imp"}]}, {"title": "Lower the hydraulic sides", "steps": ["Confirm the hydraulics are on (red switch vertical).", "In the app, open <b>Extras<\/b> and select Extra 1 or 2 (the dot is the hitch).", "Press and hold <b>EXTEND<\/b> to lower the side.", "If the app loses connection, finish on the manual override — see the <b>Override<\/b> card.", "Repeat for the other hydraulic side.", "Fit a metal leg at each of the 4 corners, wedged against the ground.", "Stand in the middle, on the edge of the rig, and lift the final side up.", "Lock all 4 points on that side (spring bolt + hinge, each top corner).", "Repeat the raise-and-lock on the other side."]}, {"title": "Power the trailer", "steps": ["Feed the 32A cable through the hole at the back-right corner.", "Run the 32A cable to the power source.", "Feed the two 16A cables out through the bottom.", "Connect the 16A cables to the source.", "Set the distro breakers on (red showing).", "At the breaker box, flip the top breaker (32A).", "Flip breaker 2 (charges the hydraulics battery).", "Flip breaker 4 (LIGHTS).", "Confirm the ceiling lights come on."]}, {"title": "Expand the rig", "steps": [{"t": "Inspect the rig for damage; tell <b>David / Theo<\/b> if there is any.", "flag": "imp"}, "Undo the 4 ratchet straps and store them in a corner.", "Remove the ceiling cables (unscrew the green pins, keep pins on the cables).", "Clear the packing foam into a corner.", "Hang the dehumidifiers on the wall handles.", "Clear everything off the floor where the rig will expand.", "Release the brakes on the left side and unfurl it into a semicircle.", "Drop the locking bolts into the floor holes.", "Release and unfurl the right side (3 bolts this side).", "Place the marker board in the centre, on its tape marks.", "Adjust every frame so it faces the centre.", "Put all the frame brakes back on."]}, {"title": "Power the rig", "steps": ["Attach the white multiplug to the left 16A cable.", "Plug the 4 rig plugs into the white multiplug.", "Take the black multiplug (3 ports) to the other side.", "Plug the 3 plugs into the black multiplug.", "Flip breakers 5 & 6 (PC).", "Frame 2: connect an ESPA box (no blue tape) using a kettle lead.", "Frame 2: plug all its DC ports into that ESPA box.", "Place an ESPA box at the rear-left and rear-right for the Sonys.", "Connect each Sony to an ESPA box with a blue-tape cable."]}, {"title": "Framing", "steps": ["Run the trigger cable under the floor mat.", "Behind the right-hand pillar (facing in from the door), check the LED hardware's two plugs are in.", "Route the orange-tape LED trigger cable through a higher eyelet, then plug it into the Sony start connector (blue tape) on frame 9.", "Check the Canons fire — mirror, then shutter.", "If any don't fire, inspect the star connectors on that section.", "Frame every camera to the rules — see the <b>Framing<\/b> card.", "Frame each Canon using the sequence on the <b>Frame a Canon<\/b> card.", {"t": "Allow 3–4 hours — this is the longest job of the setup.", "flag": "imp"}]}, {"title": "Check framing", "steps": ["Turn on all the mini-PCs.", "Check every USB hub port is turned on (blue light on each).", "Turn on the main PC and open Cyber Controller.", "Confirm every mini-PC shows as connected.", "Open Capture Grid and press <b>Start all CG<\/b>.", "Check the camera count (>180 good, >160 workable).", "Set every camera's mode to Manual — by hand at the camera.", "Set every AF camera's focus to MF — by hand at the camera.", "Set ISO, aperture and shutter in Capture Grid — see the <b>Settings<\/b> card.", "Clear any cameras still in live view (MLU shows on+up).", "Fire a single and check focus, framing and polarisation.", "Fix flagged cameras, delete, and re-fire until clean.", "Frame the Sonys — see the <b>Sony focus<\/b> card."]}, {"title": "Final check", "steps": ["Do a full Prime + Fire and check the light pass syncs.", "Press <b>Cycle<\/b> and watch all the lights fire in sequence.", "Listen for gaps; cycle a few times, watching different sections.", "For any dead light, work through the <b>Dead light<\/b> card.", "In Capture Grid → Network tab, check each mini-PC's disk space; under 250 GB, right-click it and Clean.", {"t": "All lights cycling and disk space clear — ready to scan.", "flag": "win"}]}], "reference": [{"title": "Power — what to ask for", "body": "<p><span class=\"k\">1×32A 3-ph + 2×16A single-ph<\/span><\/p>\n<p><b>or<\/b> <span class=\"k\">1×63A 3-ph<\/span> — feeds our own distro box.<\/p>\n"}, {"title": "Jump-start order", "body": "<div class=\"row\"><span class=\"lab\">Pack<\/span><span>Red→Dead (+), Black→Ground (–). Reverse to remove.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Cables<\/span><span>Red Dead+, Red Live+, Black Live–, Black Dead-ground. Reverse to remove.<\/span><\/div>\n"}, {"title": "Breaker map", "body": "<div class=\"row\"><span class=\"lab\">Top<\/span><span>32A main feed<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">2<\/span><span>charges the hydraulics battery<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">4<\/span><span>LIGHTS<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">5 &amp; 6<\/span><span>PC — final third of the rig<\/span><\/div>\n"}, {"title": "Frame a Canon (50 mm)", "body": "<p>Mode → <b>Av<\/b> &nbsp;·&nbsp; focus switch forward (AF on) &nbsp;·&nbsp; press <b>Live View<\/b>.<\/p>\n<p>Unscrew the head knob &nbsp;·&nbsp; check it's cross-polarised &nbsp;·&nbsp; half-press to focus &nbsp;·&nbsp; lock the head.<\/p>\n<p>Live View off &nbsp;·&nbsp; focus switch back (AF off) &nbsp;·&nbsp; mode back to <b>Manual<\/b>.<\/p>\n<p class=\"muted\"><b>Zoom lens:<\/b> focus before <em>and<\/em> after polarising.<\/p>\n"}, {"title": "Sony focus", "body": "<p>Subject stays centred (small people: hand above head).<\/p>\n<p>Capture Grid left panel → <b>Multiple<\/b> on → pick a Sony &nbsp;·&nbsp; main lights on.<\/p>\n<p>MF → <b>AF Continuous<\/b> → Prime + Single Fire → let it download → back to <b>MF<\/b> (subject stays put until then).<\/p>\n<p>On the Cameras page, sort by group <b>Sony<\/b> and confirm all are on MF.<\/p>\n<p>Delete, re-fire, inspect. Still soft → manual focus wheel.<\/p>\n"}, {"title": "Capture Grid settings", "body": "<div class=\"row\"><span class=\"lab\">Mode<\/span><span>Manual &nbsp;·&nbsp; <b>Focus<\/b> MF &nbsp;<span class=\"muted\">(both by hand at the camera)<\/span><\/span><\/div>\n<div class=\"row\"><span class=\"lab\">ISO<\/span><span>200 (Canon)<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Aperture<\/span><span>F11 &nbsp;·&nbsp; SPEC F22<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Shutter<\/span><span>Canon 1/25 &nbsp;·&nbsp; Sony 1/30<\/span><\/div>\n"}, {"title": "Camera framing", "body": "<p><b>Top half<\/b> — zooms full wide (marker board + person); 50 mm on the head.<\/p>\n<p><b>Bottom half<\/b> — zoom in on groin; 50 mm → nearest hand; 50 mm → nearest foot; 50 mm → other hand; bottom zoom wide.<\/p>\n"}, {"title": "Manual override", "amber": true, "body": "<div class=\"row\"><span class=\"lab\">Rods<\/span><span>front = right side, back = left. Top raise / mid neutral / bottom lower.<\/span><\/div>\n<p>One pin <b>bottom<\/b>, the other neutral. Crank left→right ~5 min. Easy = right way; hard = wrong pin, stop and check.<\/p>\n"}, {"title": "Dead light", "amber": true, "body": "<p><b>1.<\/b> Powered on? If not, find where the disconnect is.<\/p>\n<p><b>2.<\/b> On but not firing? Press <b>[Test]<\/b> — it should flash.<\/p>\n<p><b>3.<\/b> No flash → bulb may be blown. Tell David / Theo, run without it for now.<\/p>\n<p><b>4.<\/b> Flashes → replug the trigger cable at the back of the light, then cycle again.<\/p>\n<p><b>5.<\/b> Still dead → check the circuit board in the PC cage for loose connections.<\/p>\n"}]}}, {"id": "packdown", "title": "Trailer Packdown", "subtitle": "Striking & stowing the rig", "status": "ready", "guide": "<h1 id=\"disconnecting-cables\">Disconnecting Cables<\/h1>\n<p>If it hasn’t been done already, power down everything on the trailer except the lights and breaker 2 (which charges the hydraulics battery). The lights can stay on until the hydraulic walls come up.<\/p>\n<p>When powering down, make sure breakers 5 and 6 are flipped down (green), then disconnect the two multi-plugs on the floor on both sides of the trailer — the ones that attach to the 16 amp single-phase cables. None of the frames should have power after this.<\/p>\n<ol type=\"1\">\n<li><p>Unplug everything attached to the now-disconnected multi-plugs. Wrap each plug and its cable (the ones that feed the frames’ multi-plugs) around a nearby light, to keep them stowed neatly off the ground.<\/p><\/li>\n<li><p>Take the floor multi-plugs and stow them in the large plastic tub — it will probably be the one holding the FACS Sony lenses.<\/p><\/li>\n<li><p>Disconnect the 2 × Sony ESPA power boxes. Take all the DC power cables (the ones with blue tape, connecting the Sonys to the ESPA boxes) and store them as a group in the plastic tub.<\/p><\/li>\n<li><p>Disconnect the kettle lead from each ESPA power brick and wrap it neatly around a nearby light.<\/p><\/li>\n<li><p>Store both ESPA boxes and their power bricks in the plastic tub.<\/p><\/li>\n<li><p>Find the Canon ESPA box on Frame 2. Disconnect all its DC power inputs and tuck them up into the frame so they don’t drag on the ground.<\/p><\/li>\n<li><p>Disconnect its kettle lead from its power brick and wrap it neatly around a nearby light.<\/p><\/li>\n<li><p>Store that ESPA box and its power brick in the plastic tub.<\/p><\/li>\n<li><p>Find the trigger cable that runs under the door mat to connect both sides (frame 12 to frame 9). Disconnect it at one end and wrap it around a nearby light.<\/p><\/li>\n<li><p>Find the trigger cable that runs from frame 9 to the LED Arduino. Detach it from the frame and wrap it around the power cables by the Arduino.<\/p><\/li>\n<\/ol>\n<p>By this point all the cables from the rig should be off the floor, so this is the time to do a visual inspection of the rig. If you see any cables still touching the floor, try to attach them back onto the rig. There are zip ties in the trailer if you need them.<\/p>\n<h1 id=\"collapsing-the-rig\">Collapsing the Rig<\/h1>\n<p>Take the marker board out and put it somewhere out of the way — you will need it again later. Take the colour chart and stow it in the open top drawer of the PC cage.<\/p>\n<p>Before collapsing the rig, find the metal bolts that slot into the spring-loaded holes in the floor. If you are standing in the trailer door facing the rig, there are two on the left side and three on the right. Pull each bolt up and lock it in the higher position.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>There is one more bolt closest to the main PC, between frame 1 and frame 20. Leave that one attached — it holds the middle of the rig in place while you fold the sides around it.<\/p>\n<\/div>\n<p>Walk around the rig and, for all the cameras on the bottom of the frames (the Canon zoom lenses), fold their screens into the camera so they don’t stick out.<\/p>\n<p>Then walk around and release the brakes on all the frames by flicking the black plastic tab by the wheels so it is horizontal.<\/p>\n<h2 id=\"folding-the-right-side\">Folding the right side<\/h2>\n<p>Start with the right side. You are going to slowly curl the rig so that it becomes a thin “U” shape, which means moving frame 10 towards the back of the trailer.<\/p>\n<p>Go slowly — move around and pull different frames so they all travel at a similar rate. You will meet resistance; if you do, check whether a wire has fallen under a wheel. If not, it’s likely a wheel is up against one of the long bumps on the floor. The easiest way to move over the bumps is to change sides and push the frame with a foot, applying pressure to the metal bar with the wheels.<\/p>\n<p>Frame 10 should end up at the back of the trailer, wedged under the black bar running across the roof near the back. There is an obvious spot for it — you can see it in the scratches on the paintwork of the top bar.<\/p>\n<p>Make sure the frames are compressed properly. Running down the length of the trailer floor there are patches of purple tape; use these as your marker. All the frame wheels should sit inside the tape, towards the centre of the trailer.<\/p>\n<p>Once this side has collapsed, walk around and apply the brake to every wheel on it.<\/p>\n<p>Find two of the metal cables with green pins — usually stored in a corner of the trailer. Head to frame 10 and find the two eyelets on the side of the frame closest to the back of the trailer. On the horizontal bar above there are another two eyelets. Connect each eyelet on frame 10 to the closest eyelet on the horizontal bar.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>If the eyelets are too slack, you may be able to twist them and slide them along the metal — though some of them won’t move.<\/p>\n<\/div>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>The next step has not been tried on a real packdown yet, so it may need adjusting. If you do it, let David or Theo know how it went.<\/p>\n<\/div>\n<p>Take 4 × ratchet straps and, at four points along the middle frame, wrap each one around both the inner frame and the outer frame to bind them together. Do this by wrapping the strap around the hinge point of two frames, trying to catch both the vertical and the horizontal bars on the middle and the outer frames. Do them up firmly, but not so tight that they bend the frames or pull them out of position. The point of these extra straps is to stop the middle frames moving so much in transit.<\/p>\n<h2 id=\"folding-the-left-side\">Folding the left side<\/h2>\n<p>Now collapse the left side of the trailer. Again, go slowly, pulling and pushing different sections to spread the force. This side curls around the middle frames: frame 12 will end up wrapped all the way around the middle and over to the right side of the trailer, like an inverted “J”.<\/p>\n<p>Once again, make sure all the frames are inside the purple tape, then go around and apply the brakes to every wheel.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>This step has not been tried on a real packdown yet either.<\/p>\n<\/div>\n<p>Take another 4 × ratchet straps and, at four points along the outer left frame, wrap each one around the outer and inner frame to bind them together, exactly as you did on the other side. Again, make sure they aren’t so tight that they bend the frames in towards each other.<\/p>\n<h2 id=\"strapping-the-rig-down\">Strapping the rig down<\/h2>\n<p>Take 4 × ratchet straps and, in each corner of the rig, find the metal loop in the floor — these are the mount points for the straps. Thread a strap through each loop and wrap it around the top corner of the rig, trying to get it around at least two frames to bind them. These can be done up very tight.<\/p>\n<p>Find 4 × white cables with green pins and use two on each side. Look for the eyelets in the grey aluminium bars running along the trailer’s ceiling from back to front; there are corresponding eyelets on the top of the outer frames. Connect two on each side, preferably near the middle, as the ratchet straps are already holding the corners. Some of the eyelets can be moved along the metal by unscrewing them slightly and sliding them, but again, not all of them will.<\/p>\n<h1 id=\"tidying-everything-away\">Tidying Everything Away<\/h1>\n<p>Now the rig is closed, it’s time to tidy and store all the non-rig items away.<\/p>\n<ol type=\"1\">\n<li><p>Head to the PC tower and disconnect all the cables from the monitor. Lay the monitor flat, face down on top of the tower, and tape the screen down so it can’t move in transit.<\/p><\/li>\n<li><p>Put the mouse and keyboard inside the cage, then shut the cage door and twist it so it locks.<\/p><\/li>\n<li><p>If you used them, collapse the chairs and table. They should stow behind the PC tower against the back wall.<\/p><\/li>\n<li><p>Stack all the tubs, tools and boxes in front of the PC cage. There’s no definitive order — just get them tucked in nicely, with little space around them to rattle.<\/p><\/li>\n<li><p>Add the last few items, like the broom, into the gaps.<\/p><\/li>\n<li><p>Place the marker board sideways at the front of the stored objects, so it sits between the front of the PC cage and the rig. It acts as a dam, stopping anything spilling out into the rig.<\/p><\/li>\n<li><p>Take the two grey dehumidifiers off the walls and clip one to the middle of the outside of the rig on each side.<\/p><\/li>\n<li><p>Stack all the foam either outside or by the stairs — somewhere accessible that isn’t on either side of the trailer, as you will need it once the first side panels are down.<\/p><\/li>\n<li><p>Do a final inspection of the floor: everything should have a place, and the side floors should be clear.<\/p><\/li>\n<\/ol>\n<h1 id=\"storing-cables-and-power-part-one\">Storing Cables and Power — Part One<\/h1>\n<p>Head outside to the ends of your 2 × 16 amp cables. If they aren’t already unplugged, remove them from the distro box or power source (or from the extensions, if you are using them).<\/p>\n<p>Head back inside and start pulling them through the hole in the floor on the left side of the trailer. With two people, one can stay outside feeding the cable through and keeping the knots out of it. On your own, you may need to alternate between inside and outside when it snags or tangles.<\/p>\n<p>Pull the two cables through until their ports hang directly under the hole with no extra cable — the ports will not come inside the trailer.<\/p>\n<p>Take all the slack you’ve pulled up into the trailer and store it behind the marker board, or at least in that general area, where the bulk of it is clear of the collapsing sides.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>Leave the 32 amp power plugged in for now — it’s your interior lighting for the rest of the packdown.<\/p>\n<\/div>\n<h1 id=\"collapsing-the-sides-part-one\">Collapsing the Sides — Part One<\/h1>\n<p>Now you should be ready to collapse the sides. Head inside and find the two pieces of rectangular white foam. Place them on the floor where the lights (the ones with the Lidar Lounge logo) will touch when the wall comes down.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>The 2 × 16 amp single-phase cables will still be running along the floor, and that’s fine — as long as there’s no real slack on the floor, the wall will close over them.<\/p>\n<\/div>\n<p>Head to a wall and find the four connection points that lock it in place. At the top corner on either side there is a spring-assisted locking bolt and a metal locking hinge. Pull the bolt back and lock it so it’s free of the metal; for the hinge, push the slider on the front up to unlock it, then position it so the loop is free of the ceiling.<\/p>\n<p>With nothing locking it, grab the handle in the middle of the wall and pull it towards you, lowering the wall down.<\/p>\n<p>Once it’s down, check that nothing is caught and that the wall is flat.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>It’s extremely common for one or both of the metal loops on the hinges to dangle down vertically as the wall collapses, and end up propping the wall up. You will spot it because the wall won’t sit flat in the corners. To fix it, hold the wall up slightly and give the dangling loop a nudge with a foot to keep it from catching as you lower the wall back down.<\/p>\n<\/div>\n<p>Repeat all of these steps on the opposite side of the trailer.<\/p>\n<p>With both sides down, head to the breaker box and — if you haven’t already — flip the main breaker at the top down (showing green) to shut off the 32 amp power to the trailer.<\/p>\n<p>Now find the foam you moved earlier. The large pieces with cutouts in them sit over the back of some of the light pairs. The rest of the foam can be laid on the floor by the edges of the frames.<\/p>\n<h1 id=\"storing-cables-and-power-part-two\">Storing Cables and Power — Part Two<\/h1>\n<p>Head outside to your 32 amp cable and, if you haven’t already, disconnect it from the distro box, power source or extension. Bring the cable round to the back of the trailer and start pulling it through the small hole into the cupboard with the hydraulics and car battery. When you get to the port you will have to twist it and apply some pressure until it pops through.<\/p>\n<p>If you used any extensions, disconnect them from the distro or power source, coil them up and store them in the back of the trailer on the shelf above the cupboard with the hydraulics and car battery.<\/p>\n<p>If you used our distro box and/or our 63 amp cable, disconnect them from the power source — the 63 amp cable has to be twisted before it will come out. Store the distro box and the 63 amp cable on the shelf.<\/p>\n<h1 id=\
