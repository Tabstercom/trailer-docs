"collapsing-the-sides-part-two\">Collapsing the Sides — Part Two<\/h1>\n<p>You will need to switch the hydraulics on. Open the shutter door at the back by the hitch point. On the left side, to the right of the AC unit, you should find a red turn-switch — twist it so it is vertical to enable the hydraulics.<\/p>\n<p>In the app, go to the Extras page. There will be Extra 1 and Extra 2 — one for each side. A trailer diagram will confirm which side you are controlling; the dot in the diagram is the hitch point, so use that to orient yourself.<\/p>\n<p>To raise the sides, press and hold RETRACT and the side should start rising. Around two times out of ten — less often than when extending — the hydraulics battery will fail, the app will lose connection and the side won’t move. If this happens at any stage of raising the sides, you will have to finish with the manual override system.<\/p>\n<h2 id=\"manual-override\">Manual override<\/h2>\n<p>In the rear of the trailer, behind the shutter door on the right, you will find the hydraulic override.<\/p>\n<p>There are two silver metal rods with twisty tops; these control what operation the manual crank will perform. The rod in front controls the right side, and the rod at the back controls the left side. Each rod has three states: raise, neutral, and lower.<\/p>\n<p>On the back of the rod you will see a small pin and some channels cut into the rod for the pin to slide through. It looks and behaves similarly to a manual transmission in a car, but instead of 5–6 gears there are three. Each position puts the hydraulics into one of the three states:<\/p>\n<ul>\n<li><p><strong>Top:<\/strong> raise<\/p><\/li>\n<li><p><strong>Middle:<\/strong> neutral<\/p><\/li>\n<li><p><strong>Bottom:<\/strong> lower<\/p><\/li>\n<\/ul>\n<p>To move the pin, twist the top of the rod to move it laterally, and pull or push to move it vertically.<\/p>\n<p>To continue, put one pin into the top position and make sure the other is in neutral. Then retrieve the crank bar from its place on the inside of the cabinet door next to you. To the right of the control rods you will see a hole that the crank bar slots into.<\/p>\n<ol type=\"1\">\n<li><p>Crank the bar from left to right. It should feel relatively easy; if it is resisting hard, stop and double-check the pins, as you may be trying to lower the side.<\/p><\/li>\n<li><p>After about ten cranks, go and visually check that the desired side is rising. It takes around five minutes of cranking to fully raise a side.<\/p><\/li>\n<li><p>Keep cranking until you feel resistance.<\/p><\/li>\n<\/ol>\n<h2 id=\"locking-the-raised-side\">Locking the raised side<\/h2>\n<p>Once the side is completely raised, find the two spring bolts on the sides of the panel. Release each bolt and slide it into the side to lock the panel in place. The panel should have some movement in it, so you may need to give it a shove before the bolt will slide in. In rare cases the bolt may be jammed because there is too much pressure on it; if this happens, raise the legs on this side of the trailer and/or lower the legs on the opposite side, so the weight of the trailer leans away from the panel.<\/p>\n<p>Repeat these steps in exactly the same way on the opposite side of the trailer.<\/p>\n<p>You can now switch the hydraulics off (turn the red switch sideways).<\/p>\n<h2 id=\"folding-in-the-panels-and-the-roof\">Folding in the panels and the roof<\/h2>\n<p>Once both sides are raised, find the four backup metal legs. Now that the full weight is off them they should be fairly easy to undo. Remove all four and stow them on the floor at the front of the trailer.<\/p>\n<p>On each side, fold the side panels in until they rest against the wall. Once they are tucked in, you can bring the roof down.<\/p>\n<p>Bringing the roof down is very physically demanding and often needs two people. There is a handle made from the red cable and small carabiners in the middle, which helps if the roof is out of reach. Pull it down hard, then push until it folds into the side of the trailer.<\/p>\n<p>On the side of the trailer there are three connections to lock. At either end is a spring-assisted locking bolt: pull it down, twist it until it’s released, then let it snap up into place. In the centre is a red cable with two small carabiners — detach one carabiner and clip it to the small hole in the frame of the trailer’s chassis.<\/p>\n<div class=\"callout note\"><span class=\"clabel\">Note<\/span><p>If the trailer is heading out for a multi-day transit, or nobody will be there on the other side to receive it, you may want to lock the front of the trailer and give the keys to the driver. The keys are in a clear plastic ziplock bag inside a small white panel, found at the top of the stairs on the left (if you are facing the trailer), near the door.<\/p>\n<\/div>\n<h2 id=\"the-stairs\">The stairs<\/h2>\n<p>Head over to the stairs, stand at the top and pull the roof over the stairs down.<\/p>\n<div class=\"callout imp\"><span class=\"clabel\">Important<\/span><p>Be careful — water pools on top of this section when it rains, and it’s easy to soak yourself.<\/p>\n<\/div>\n<p>Find the two spring-loaded bolts on the corners of the now-collapsed roof section, then twist and release them so they slide into the sides, locking the roof in place.<\/p>\n<p>Head down the stairs, lift them up and give them a hard push so they lock into place and become the front door. If you are locking this door with the keys, this is the time.<\/p>\n<p>Finally, find a small carabiner and attach it to the stair section — it’s an emergency backup in case the stairs try to open in transit.<\/p>\n<h1 id=\"loading-the-trailer\">Loading the Trailer<\/h1>\n<p>The trailer is now ready to be moved. The hydraulic feet should stay down, supporting the weight, until a vehicle arrives to collect it.<\/p>\n<p>When the driver arrives, turn the hydraulics on with the small red switch, flipping it vertical.<\/p>\n<p>Head to the back by the hitch point and wind up the jockey wheel. Once it’s high enough it should pivot 90 degrees, and a lever will lock it in position out of the way.<\/p>\n<h2 id=\"onto-a-flatbed-recovery-lorry\">Onto a flatbed recovery lorry<\/h2>\n<p>If the trailer is heading straight onto a flat recovery lorry, use the HPC app to RETRACT all the legs so it is sitting only on its wheels. If you are able, unlock the handbrake by pulling the black lever by the hitch point; if you can’t, or you’re unsure, ask the driver, as they will be familiar with it.<\/p>\n<p>Sometimes the trailer has trouble getting onto a flatbed, thanks to terrible design. This is not your job to solve — let the driver figure it out. You should tell them that you have control over the legs, though, as they may ask you to raise or lower them at several points to help.<\/p>\n<p>Once it’s on the flatbed and the driver is happy, EXTEND the legs using the HPC app until they are once again taking the weight of the trailer. Don’t worry about getting the trailer level — it will probably sit at a slight angle on the flatbed. Instead, get the trailer’s floor as parallel to the bed’s floor as you can.<\/p>\n<p>Once it’s stable, hop up onto the flatbed and switch the hydraulics off by flipping the red switch horizontal.<\/p>\n<h2 id=\"onto-a-tow-bar\">Onto a tow bar<\/h2>\n<p>If it’s being picked up by a van or car and going on a tow bar, explain to the driver that you can lift the hitch point of the trailer using the hydraulic legs. Raise the hitch point, let the driver reverse until their ball joint is directly under the hitch, then lower the hitch onto the joint.<\/p>\n<p>Once it’s on, RETRACT all the legs through the HPC app if you haven’t already.<\/p>\n<p>If you have locked the trailer, give the driver the ziplock bag of keys, so they stay with the trailer.<\/p>\n<p>Finally, switch the hydraulics off by flipping the red switch horizontal.<\/p>\n", "toc": [["disconnecting-cables", "Disconnecting Cables"], ["collapsing-the-rig", "Collapsing the Rig"], ["tidying-everything-away", "Tidying Everything Away"], ["storing-cables-and-power-part-one", "Storing Cables and Power — Part One"], ["collapsing-the-sides-part-one", "Collapsing the Sides — Part One"], ["storing-cables-and-power-part-two", "Storing Cables and Power — Part Two"], ["collapsing-the-sides-part-two", "Collapsing the Sides — Part Two"], ["loading-the-trailer", "Loading the Trailer"]], "hasPhotos": false, "checklist": {"phases": [{"title": "Disconnect the cables", "steps": ["Power everything down except the lights and breaker 2 (hydraulics battery).", "Flip breakers 5 & 6 down (green).", "Disconnect the two floor multi-plugs (the 16A single-phase ones), both sides.", "Unplug the plugs that power the frames and wrap each around a nearby light.", "Stow both floor multi-plugs in the large plastic tub.", "Disconnect the 2 × Sony ESPA boxes; group the blue-tape DC cables in the tub.", "Wrap each ESPA kettle lead around a nearby light.", "Stow both Sony ESPA boxes and their power bricks in the tub.", "Frame 2: disconnect the Canon ESPA box and tuck its DC inputs up into the frame.", "Wrap its kettle lead around a light; stow the box and brick in the tub.", "Disconnect the under-mat trigger cable (frame 12 → 9) at one end; wrap it on a light.", "Detach the frame 9 → LED Arduino trigger cable; wrap it by the Arduino.", {"t": "Walk the rig — nothing left touching the floor. Zip-tie strays back on.", "flag": "imp"}]}, {"title": "Collapse the rig", "steps": ["Take the marker board out and set it aside — you need it later.", "Stow the colour chart in the open top drawer of the PC cage.", "Pull up and lock the floor bolts — 2 on the left, 3 on the right.", {"t": "Leave the bolt nearest the main PC (between frames 1 & 20) attached.", "flag": "imp"}, "Fold the screens into the bottom-row Canon zoom cameras.", "Release every frame brake (black tab horizontal).", "Right side: curl the rig into a thin <b>U<\/b>, walking frame 10 to the back.", "Wedge frame 10 under the black roof bar (look for the scratches).", "Check all wheels sit inside the purple floor tape.", "Brake every wheel on the collapsed side.", "Link frame 10's two rear eyelets to the horizontal bar with 2 green-pin metal cables.", "Left side: curl frame 12 around the middle into an inverted <b>J<\/b>.", "Check the purple tape again, then brake every wheel.", "Ratchet the 4 corners to the floor loops, around at least 2 frames — very tight.", "Link 2 green-pin cables per side, ceiling bar to the top of the outer frames.", {"t": "Untested: 4 straps per side binding middle frame to outer frame — firm, not tight.", "flag": "imp"}]}, {"title": "Tidy everything away", "steps": ["Disconnect the monitor and lay it face down on the tower; tape it in place.", "Put the mouse and keyboard in the cage, shut the door and twist it to lock.", "Collapse any chairs and the table behind the PC tower, against the back wall.", "Stack the tubs, tools and boxes in front of the PC cage, tightly packed.", "Add the loose items (broom etc.) into the gaps.", "Wedge the marker board sideways across the front, as a dam.", "Clip a grey dehumidifier to the middle of the outside of the rig, each side.", "Stack the foam outside or by the stairs — not on either side of the trailer.", "Final floor check — both side floors clear."]}, {"title": "Cables & power — part one", "steps": ["Unplug the two 16A cables from the distro, source or extensions.", "Pull them back through the floor hole on the left side.", "Stop when the ports hang directly under the hole, no slack outside.", "Coil the slack behind the marker board, clear of the collapsing sides.", "Leave the 32A plugged in — it's your interior lighting for now."]}, {"title": "Collapse the sides — part one", "steps": ["Lay the two white foam rectangles where the logo lights will land.", "Release the 4 points on the wall — spring bolt + hinge at each top corner.", "Pull the centre handle and lower the wall.", {"t": "Check it's ack roof bar → thin <b>U<\/b>.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Left<\/span><span>Frame 12 wraps right around the middle → inverted <b>J<\/b>.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Both<\/span><span>All wheels inside the purple tape, then brakes on.<\/span><\/div>\n<p class=\"muted\">Stuck? Check for a wire under a wheel; otherwise it's a floor bump — push it with a foot on the wheel bar.<\/p>\n"}, {"title": "What holds the rig", "body": "<div class=\"row\"><span class=\"lab\">Floor bolt<\/span><span>The one at frames 1/20 by the main PC <b>stays in<\/b>.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Green pins<\/span><span>2 metal cables, frame 10 → horizontal bar.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">Corners<\/span><span>4 ratchets, floor loop → top corner, ≥2 frames. Very tight.<\/span><\/div>\n<div class=\"row\"><span class=\"lab\">White pins<\/span><span>4 cables, ceiling bar → outer frame tops, 2 per side, near the middle.<\/span><\/div>\n"}, {"title": "Manual override (raising)", "amber": true, "body": "<div class=\"row\"><span class=\"lab\">Rods<\/span><span>front = right side, back = left. Top raise / mid neutral / bottom lower.<\/span><\/div>\n<p>One pin <b>top<\/b>, the other neutral. Crank left→right ~5 min. Easy = right way; hard = wrong pin, stop and check.<\/p>\n<p class=\"muted\">Check visually after ~10 cranks. Stop at resistance, then lock the two spring bolts.<\/p>\n"}, {"title": "Untested steps", "amber": true, "body": "<p>The <b>frame-binding ratchet straps<\/b> (4 per side, middle frame to outer frame) have not been used on a real packdown yet.<\/p>\n<p>Do them up firmly, but not tight enough to bend the frames or pull them out of position.<\/p>\n<p class=\"muted\">The 4 corner straps to the floor loops <em>are<\/em> tested — those go on very tight.<\/p>\n"}, {"title": "Trailer keys", "body": "<p>Clear ziplock bag, inside the small white panel at the top of the stairs on the left <script>
(function(){
  const M = (window.MANUALS || []);
  const B = Object.assign({version:'0.0.0', date:'', stamp:''}, window.BUILD || {});
  const app = document.getElementById('app');
  const byId = id => M.find(m => m.id === id);
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
  const CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const VIEWS = ['guide','illustrated','checklist'];
  const VLABEL = {guide:'Guide', illustrated:'Illustrated', checklist:'Checklist'};

  function parseHash(){
    const h = (location.hash || '').replace(/^#\/?/, '');
    const [id, view] = h.split('/');
    return {id: id || null, view: VIEWS.includes(view) ? view : 'guide'};
  }
  function go(id, view){ location.hash = id ? ('#' + id + '/' + (view||'guide')) : '#'; }

  // ---------- hub ----------
  function renderHub(){
    let tiles = '';
    for(const m of M){
      const soon = m.status !== 'ready';
      if(soon){
        tiles += `<div class="tile soon">
          <span class="tt">${m.title}</span><span class="ts">${m.subtitle}</span>
          <span class="pill">Coming soon</span></div>`;
      } else {
        tiles += `<a class="tile" href="#${m.id}/guide">
          <span class="tt">${m.title}</span><span class="ts">${m.subtitle}</span>
          <span class="pill">Open</span></a>`;
      }
    }
    app.innerHTML = `
      <div class="bar"><div class="bar-row"><h1>Trailer Docs</h1>
        <span class="build"><span class="v">v${B.version}</span>
        <span class="d">${B.date}</span></span></div></div>
      <div class="wrap">
        <div class="hero">
          <div class="kicker">On-site manuals</div>
          <h2>Trailer Docs</h2>
          <p>Pick a manual. Each has a full guide and a tap-through checklist.</p>
        </div>
        <div class="tiles">${tiles}</div>
        <footer>Works offline &middot; add to your home screen to run full-screen<br>
          Version ${B.version} &middot; built ${B.stamp}</footer>
      </div>`;
    window.scrollTo(0,0);
  }

  // ---------- manual ----------
  function renderManual(m, view){
    const tabs = VIEWS.map(v =>
      `<button class="tab${v===view?' active':''}" data-v="${v}">${VLABEL[v]}</button>`).join('');
    const showCount = view === 'checklist';
    app.innerHTML = `
      <div class="bar">
        <div class="bar-row">
          <button class="backbtn" id="back" aria-label="All manuals">&#8592;</button>
          <span class="mtitle">${m.title}</span>
          ${showCount ? '<span class="count" id="count">0 / 0</span><button class="reset" id="reset">Reset</button>' : ''}
        </div>
        ${showCount ? '<div class="progress"><i id="bar"></i></div>' : ''}
      </div>
      <div class="tabs"><div class="tabs-in">${tabs}</div></div>
      <div class="wrap" id="content"></div>`;
    document.getElementById('back').onclick = () => go(null);
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => go(m.id, b.dataset.v));
    const content = document.getElementById('content');
    if(view === 'checklist') renderChecklist(m, content);
    else renderReading(m, view, content);
    window.scrollTo(0,0);
  }

  function renderReading(m, view, content){
    const toc = (m.toc||[]).map(([hid,t]) =>
      `<li><a href="#${m.id}/${view}::${hid}">${t}</a></li>`).join('');
    const banner = (view==='illustrated' && !m.hasPhotos)
      ? '<div class="photobanner">Illustrated version — photos will be added here once the shoot is done. For now this shows the full text.</div>' : '';
    content.innerHTML = `
      <div class="reading ${view==='illustrated'?'show-img':''}">
        <details class="toc" open><summary>Contents ${CHEV}</summary><ol>${toc}</ol></details>
        ${banner}
        <div class="doc">${m.guide}</div>
        <a class="totop" href="javascript:scrollTo(0,0)">&#8593; Back to top</a>
        <footer>${m.title} &middot; ${m.subtitle}</footer>
      </div>`;
    // in-page anchor jumps (encoded as view::id in hash)
    content.querySelectorAll('.toc a').forEach(a => {
      a.onclick = e => {
        e.preventDefault();
        const id = a.getAttribute('href').split('::')[1];
        const el = document.getElementById(id);
        if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
      };
    });
  }

  function renderChecklist(m, content){
    const cl = m.checklist || {phases:[], reference:[]};
    const key = 'tds-' + m.id + '-v1';
    let state = {};
    try { state = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch(e){ state = {}; }
    let total = 0;

    const frag = document.createDocumentFragment();
    cl.phases.forEach((ph, pi) => {
      const det = document.createElement('details');
      det.className = 'phase'; det.open = true; det.id = 'p'+(pi+1);
      const sum = document.createElement('summary');
      sum.innerHTML = `<span class="badge">${pi+1}</span><span class="phase-title">${ph.title}</span>${CHEV}`;
      det.appendChild(sum);
      const steps = document.createElement('div'); steps.className = 'steps';
      (ph.steps||[]).forEach((st, si) => {
        const txt = (typeof st === 'string') ? st : st.t;
        const kind = (typeof st === 'string') ? '' : (st.flag || '');
        total++;
        const id = 'p'+pi+'s'+si;
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'step' + (kind?(' '+kind):'');
        const flag = kind==='imp' ? '<span class="flag">! </span>' : '';
        btn.innerHTML = `<span class="cbox">${CHECK}</span><span class="step-txt">${flag}${txt}</span>`;
        if(state[id]) btn.classList.add('done');
        btn.onclick = () => { btn.classList.toggle('done'); state[id]=btn.classList.contains('done'); save(); tally(); };
        steps.appendChild(btn);
      });
      det.appendChild(steps);
      frag.appendChild(det);
    });

    if((cl.reference||[]).length){
      const rh = document.createElement('div'); rh.className='ref-head'; rh.textContent='Quick reference';
      frag.appendChild(rh);
      cl.reference.forEach(r => {
        const card = document.createElement('div');
        card.className = 'card' + (r.amber?' amber':'');
        card.innerHTML = `<h3>${r.title}</h3>${r.body||''}`;
        frag.appendChild(card);
      });
    }
    const foot = document.createElement('footer');
    foot.innerHTML = 'Companion to the full ' + m.title + ' guide.';
    frag.appendChild(foot);

    const box = document.createElement('div'); box.className='checklist';
    box.appendChild(frag); content.appendChild(box);

    const countEl = document.getElementById('count');
    const barEl = document.getElementById('bar');
    function tally(){
      let done=0; for(const k in state) if(state[k]) done++;
      if(countEl) countEl.textContent = done + ' / ' + total;
      if(barEl) barEl.style.width = (total? (done/total*100):0) + '%';
    }
    function save(){ try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){} }
    const rb = document.getElementById('reset');
    if(rb) rb.onclick = () => { state={}; save();
      content.querySelectorAll('button.step.done').forEach(b=>b.classList.remove('done')); tally(); };
    tally();
  }

  function render(){
    const {id, view} = parseHash();
    const m = id && byId(id);
    if(!m || m.status !== 'ready'){ renderHub(); return; }
    renderManual(m, view);
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
<script>
// Offline is the whole job: installed to the home screen, this runs with no
// signal at all. Registration failing is not fatal -- the app still works,
// it just won't survive losing the network.
if('serviceWorker' in navigator){
  var SW_START = Date.now();

  // How long after opening the app an update may reload the page underneath
  // you. A new worker activates and claims this page, but claiming does not
  // re-render it -- without the reload the new content sits downloaded and
  // unseen until the next launch. Reloading is only polite while they are
  // still on the hub; someone ten minutes into a checklist would lose their
  // scroll position and tab for content that can wait for the next launch.
  // Ticks live in localStorage, so those survive either way.
  var RELOAD_WINDOW = 15000;
  var reloading = false;

  // No controller means this is a first install, and the claim that follows
  // is not an update worth reloading for.
  var hadController = !!navigator.serviceWorker.controller;

  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadController || reloading) return;
    if(Date.now() - SW_START > RELOAD_WINDOW) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.update();
      // A phone left open on the rig for days never navigates, so the
      // browser's own once-a-day check may not come round. Ask again
      // whenever the app comes back to the foreground.
      document.addEventListener('visibilitychange', function(){
        if(document.visibilityState === 'visible') reg.update();
      });
    }).catch(function(){});
  });
}
</script>
